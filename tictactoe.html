<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe — Retro Web Arcade</title>
  <meta name="description" content="Play Tic-Tac-Toe vs a friend or the CPU — part of Retro Web Arcade." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/crt.css" />
  <link rel="stylesheet" href="css/game.css" />
  <link rel="stylesheet" href="css/tictactoe.css" />
</head>
<body>

  <div class="crt">
    <div class="crt__scanlines"></div>
    <div class="crt__vignette"></div>
    <div class="crt__flicker"></div>
    <div class="crt__grain"></div>

    <div class="game-page">

      <header class="game-header">
        <a class="game-header__back" href="index.html">&larr; ARCADE</a>
        <h1 class="game-header__title glow-amber">TIC-TAC-TOE</h1>
      </header>

      <div class="ttt-mode-select" id="mode-select">
        <button class="ttt-mode-btn" data-mode="cpu">VS CPU</button>
        <button class="ttt-mode-btn" data-mode="human">VS FRIEND</button>
      </div>

      <div class="game-hud">
        <div class="game-hud__stat">
          X WINS <span id="score-x" class="glow-amber">0</span>
        </div>
        <div class="game-hud__stat">
          O WINS <span id="score-o" class="glow-cyan">0</span>
        </div>
      </div>

      <div class="ttt-status" id="ttt-status">SELECT A MODE TO BEGIN</div>

      <div class="ttt-board" id="ttt-board">
        <!-- 9 cells injected by JS -->
      </div>

      <button class="game-overlay__button ttt-reset" id="ttt-reset">RESET BOARD</button>

    </div>
  </div>

  <script type="module" src="js/games/tictactoe.js"></script>
</body>
</html>
